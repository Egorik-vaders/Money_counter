<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Трекер Финансов</title>
  </head>
  <body>
    <div class="container">
      <div class="sumWrapper">
        <div>Сумма:</div>
        <div class="count">0</div>
      </div>

      <input class="operationValue" type="number" name="" id="" />

      <div class="buttonsWrapper">
        <button class="switchButton btnOutlay">Расход</button>
        <button class="switchButton btnIncome">Доход</button>
      </div>
      <select name="" id="categorySelect">
        <option value="Еда">Еда</option>
        <option value="Медицина">Медицина</option>
        <option value="Развлечение">Развлечение</option>
        <option value="Транспорт">Транспорт</option>
        <option value="Прочее">Прочее</option>
      </select>
      <div class="operationsWrapper">
        <div class="operation">
          <p>1</p>
          <p>Еда</p>
          <p class="income outlay cost">1250</p>
          <p>12.10.2026</p>
        </div>
        
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
